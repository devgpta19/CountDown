  <style>
    /* Modern Glassmorphism & Micro-Surfaces */
    .glass-dark {
      background: rgba(18, 22, 31, 0.78);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7), inset 0 1px 0 0 rgba(255, 255, 255, 0.06);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.035);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* Clean Gallery Porcelain Surfaces (Light Mode) */
    .neu-raised, .neu-card {
      background: #FFFFFF;
      border: 1px solid rgba(226, 232, 240, 0.9);
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.04), 0 2px 6px -1px rgba(0, 0, 0, 0.02);
    }
    .neu-sunken {
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
    }
    .neu-btn {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      color: #334155;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .neu-btn:hover {
      background: #F8FAFC;
      border-color: #CBD5E1;
      color: #0F172A;
    }
    .neu-btn:active {
      transform: scale(0.97);
    }

    .dial-glow {
      filter: drop-shadow(0 0 14px rgba(16, 185, 129, 0.5));
    }

    /* Ambient Subtle Grid Background */
    .blueprint-grid-dark {
      background-size: 32px 32px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
    }
    .blueprint-grid-light {
      background-size: 32px 32px;
      background-image: 
        linear-gradient(to right, rgba(0, 0, 0, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 0, 0, 0.04) 1px, transparent 1px);
    }

    /* Responsive Dashboard Grid & Widgets */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      grid-auto-rows: minmax(44px, auto);
      gap: 16px;
    }

    @media (max-width: 639px) {
      .dashboard-grid {
        display: flex !important;
        flex-direction: column !important;
        gap: 16px !important;
      }
      .dashboard-widget {
        width: 100% !important;
        min-width: 100% !important;
        order: var(--widget-order, 0);
      }
      /* Hide horizontal edge resize handles on mobile since widgets are full width */
      .handle-w, .handle-e, .handle-nw, .handle-ne, .handle-sw, .handle-se {
        display: none !important;
      }
    }

    .drag-handle {
      cursor: grab;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    .drag-handle:active {
      cursor: grabbing;
    }
    .widget-dragging {
      opacity: 0.95;
      transform: scale(1.01);
      z-index: 40 !important;
      box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.75), 0 0 0 2px #10B981 !important;
    }

    /* 8-Directional Resize Handles with generous touch hit area */
    .resize-handle-corner {
      position: absolute;
      width: 28px;
      height: 28px;
      z-index: 35;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
    }
    .resize-handle-edge {
      position: absolute;
      z-index: 34;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
    }

    .handle-nw { top: -8px; left: -8px; cursor: nwse-resize; }
    .handle-ne { top: -8px; right: -8px; cursor: nesw-resize; }
    .handle-sw { bottom: -8px; left: -8px; cursor: nesw-resize; }
    .handle-se { bottom: -8px; right: -8px; cursor: nwse-resize; }

    .handle-n { top: -8px; left: 24px; right: 24px; height: 16px; cursor: ns-resize; }
    .handle-s { bottom: -8px; left: 24px; right: 24px; height: 16px; cursor: ns-resize; }
    .handle-w { left: -8px; top: 24px; bottom: 24px; width: 16px; cursor: ew-resize; }
    .handle-e { right: -8px; top: 24px; bottom: 24px; width: 16px; cursor: ew-resize; }

    .handle-indicator-corner {
      width: 7px;
      height: 7px;
      border-radius: 9999px;
      background: #10B981;
      opacity: 0;
      transition: all 0.2s ease;
    }
    .handle-indicator-edge {
      border-radius: 9999px;
      background: #10B981;
      opacity: 0;
      transition: all 0.2s ease;
    }

    .group:hover .handle-indicator-corner,
    .resize-handle-corner:hover .handle-indicator-corner,
    .resize-handle-corner:active .handle-indicator-corner {
      opacity: 0.8;
      transform: scale(1.3);
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.7);
    }

    .group:hover .handle-indicator-edge,
    .resize-handle-edge:hover .handle-indicator-edge,
    .resize-handle-edge:active .handle-indicator-edge {
      opacity: 0.5;
    }

    /* Scrollbars */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    .dark ::-webkit-scrollbar-thumb, html:not(.light) ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 9999px;
    }
    .custom-scroll {
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
    }
  </style>

    // Tactile haptic feedback helper (Web Vibration API & Capacitor Haptics fallback)
    const triggerHaptic = (style = "light") => {
      try {
        if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Haptics) {
          window.Capacitor.Plugins.Haptics.impact({ style: style === "medium" ? "MEDIUM" : "LIGHT" });
        } else if (navigator.vibrate) {
          navigator.vibrate(style === "medium" ? 22 : 10);
        }
      } catch (e) {}
    };

        case "external-link":

              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>

        case "minus":
          return (

              <line x1="5" y1="12" x2="19" y2="12"></line>

        case "maximize":

              <line x1="21" y1="3" x2="14" y2="10"></line>
              <line x1="3" y1="21" x2="10" y2="14"></line>
            </svg>
          );
        case "minimize":
          return (

              <line x1="14" y1="10" x2="21" y2="3"></line>
              <line x1="3" y1="21" x2="10" y2="14"></line>
            </svg>
          );

          return (
            <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          );
        case "chevron-up":
          return (
            <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <polyline points="18 15 12 9 6 15"></polyline>
            </svg>
          );
        default:
          return null;
      }
    };

    const TIMEZONES = [
      { label: "IST", zone: "Asia/Kolkata" },
      { label: "UTC", zone: "UTC" },
      { label: "EST", zone: "America/New_York" },
      { label: "PST", zone: "America/Los_Angeles" }
    ];

    const DEFAULT_TARGET_ISO = "2026-11-16T09:00:00+05:30";
    const DEFAULT_TARGET_TITLE = "PORTFOLIO SUBMISSION";

    const INITIAL_MILESTONES = [
      { id: "m1", tag: "T-10", dateStr: "Nov 06, 2026", isoDate: "2026-11-06T09:00:00", title: "Audit content and assets", desc: "Collect design projects, artifacts & case studies." },
      { id: "m2", tag: "T-7",  dateStr: "Nov 09, 2026", isoDate: "2026-11-09T09:00:00", title: "Finalize wireframes and copy", desc: "Complete typography, hero flow and project descriptions." },
      { id: "m3", tag: "T-5",  dateStr: "Nov 11, 2026", isoDate: "2026-11-11T09:00:00", title: "Complete core page build", desc: "Build out hero section, project gallery and contact card." },
      { id: "m4", tag: "T-3",  dateStr: "Nov 13, 2026", isoDate: "2026-11-13T09:00:00", title: "Finish responsiveness and testing", desc: "Audit mobile viewports, touch targets, and light/dark styling." },
      { id: "m5", tag: "T-1",  dateStr: "Nov 15, 2026", isoDate: "2026-11-15T09:00:00", title: "Proofread and freeze code", desc: "Final spellcheck, clean metadata, and freeze commits." },
      { id: "m6", tag: "T-0",  dateStr: "Nov 16, 2026", isoDate: "2026-11-16T09:00:00", title: "Submit final portfolio", desc: "Ship the submission link to the reviewers." }
    ];

    function App() {
      const [theme, setTheme] = useState(() => {
        return localStorage.getItem("tminus_theme") || "dark";
      });
      const [selectedTz, setSelectedTz] = useState(TIMEZONES[0].zone);
      const [now, setNow] = useState(Date.now());
      const [forceRadialMode, setForceRadialMode] = useState(false);
      
      // Customizable Target Event & Deadline
      const [targetIso, setTargetIso] = useState(() => {
        return localStorage.getItem("tminus_target_iso") || DEFAULT_TARGET_ISO;
      });
      const [targetTitle, setTargetTitle] = useState(() => {
        return localStorage.getItem("tminus_target_title") || DEFAULT_TARGET_TITLE;
      });

      // Customizable Milestones List
      const [milestones, setMilestones] = useState(() => {
        try {
          const saved = localStorage.getItem("custom_milestones_list");
          if (saved) return JSON.parse(saved);
        } catch(e) {}
        return INITIAL_MILESTONES;
      });

      const [completed, setCompleted] = useState(() => {
        try {
          const cached = localStorage.getItem("milestones_cache");
          return cached ? JSON.parse(cached) : {};
        } catch {
          return {};
        }
      });

      const [showCalendarModal, setShowCalendarModal] = useState(false);
      const [showSprintModal, setShowSprintModal] = useState(false);
      const [toastMsg, setToastMsg] = useState("");
      const [isEditMode, setIsEditMode] = useState(false);

      // Temporary state for the Sprint Configuration Modal
      const [tempTitle, setTempTitle] = useState(targetTitle);
      const [tempIso, setTempIso] = useState(targetIso.slice(0, 16));
      const [newMilestoneTag, setNewMilestoneTag] = useState("");
      const [newMilestoneTitle, setNewMilestoneTitle] = useState("");
      const [newMilestoneDesc, setNewMilestoneDesc] = useState("");
      const [newMilestoneDate, setNewMilestoneDate] = useState("");

      // Lowest limits: Allowed to minimize much lower to ultra-compact single row (h: 1, w: 1)
      const MIN_CONSTRAINTS = {
        countdown: { minW: 1, minH: 1 },
        milestones: { minW: 1, minH: 1 },
        progress: { minW: 1, minH: 1 }
      };

      const DEFAULT_GRID_LAYOUT = {
        countdown:  { col: 1, row: 1, w: 4, h: 6 },
        milestones: { col: 5, row: 1, w: 4, h: 6 },
        progress:   { col: 1, row: 7, w: 8, h: 3 }
      };

      const [gridLayout, setGridLayout] = useState(() => {
        try {
          const saved = localStorage.getItem("custom_coord_grid_layout");
          if (saved) return JSON.parse(saved);
        } catch(e) {}
        return DEFAULT_GRID_LAYOUT;
      });

      // Minimized state toggle for widgets
      const [minimized, setMinimized] = useState(() => {
        try {
          const saved = localStorage.getItem("tminus_minimized_widgets");
          return saved ? JSON.parse(saved) : {};
        } catch {
          return {};
        }
      });

      const [activeDragId, setActiveDragId] = useState(null);
      const [resizingId, setResizingId] = useState(null);
      const [hoverCoord, setHoverCoord] = useState(null);
      const gridContainerRef = useRef(null);
      const dragStartOffset = useRef({
        pointerId: null,
        targetEl: null,
        mouseX: 0,
        mouseY: 0,
        grabColOffset: 0,
        grabRowOffset: 0,
        origCol: 1,
        origRow: 1,
        origW: 4,
        origH: 6,
        initialLayout: null,
        isDraggingActive: false
      });

      const activeDragIdRef = useRef(null);
      const resizingIdRef = useRef(null);
      const gridLayoutRef = useRef(gridLayout);
      useEffect(() => {
        gridLayoutRef.current = gridLayout;
      }, [gridLayout]);

      // Save Theme to localStorage and HTML root
      useEffect(() => {
        try {
          localStorage.setItem("tminus_theme", theme);
        } catch(e) {}
        if (theme === "dark") {
          document.documentElement.classList.add("dark");
          document.documentElement.classList.remove("light");
        } else {
          document.documentElement.classList.add("light");
          document.documentElement.classList.remove("dark");
        }
      }, [theme]);

      const saveLayout = (updated) => {
        setGridLayout(updated);
        gridLayoutRef.current = updated;
        try {
          localStorage.setItem("custom_coord_grid_layout", JSON.stringify(updated));
        } catch(e) {}
      };

      // Deterministic 2D bidirectional gravity packing engine:
      // - Locks activeId at user-requested coordinates/dimensions
      // - Sorts remaining widgets in their established visual order
      // - Packs each remaining widget into the earliest available row (>= 1) without collision
      // - Expanding smoothly pushes lower widgets down; compacting smoothly pulls lower widgets UP!
      const packLayout = (layout, activeId = null) => {
        const result = {};

        // If an active widget is being manipulated, lock its requested bounds
        if (activeId && layout[activeId]) {
          const active = layout[activeId];
          const clampedW = Math.max(1, Math.min(8, active.w));
          const clampedCol = Math.max(1, Math.min(8 - clampedW + 1, active.col));
          const clampedRow = Math.max(1, active.row);
          const clampedH = Math.max(1, active.h);
          result[activeId] = {
            ...active,
            col: clampedCol,
            row: clampedRow,
            w: clampedW,
            h: clampedH
          };
        }

        // Helper: 2D bounding-box collision detection
        const collides = (a, b) => {
          return !(
            a.col + a.w <= b.col ||
            a.col >= b.col + b.w ||
            a.row + a.h <= b.row ||
            a.row >= b.row + b.h
          );
        };

        // Sort all other widgets by vertical visual order (row, then col)
        const otherKeys = Object.keys(layout)
          .filter((k) => k !== activeId)
          .sort((k1, k2) => {
            if (layout[k1].row !== layout[k2].row) {
              return layout[k1].row - layout[k2].row;
            }
            return layout[k1].col - layout[k2].col;
          });

        // Pack each remaining widget upwards with gravity into the earliest free row >= 1
        for (const key of otherKeys) {
          const item = { ...layout[key] };
          const clampedW = Math.max(1, Math.min(8, item.w));
          item.w = clampedW;
          item.col = Math.max(1, Math.min(8 - clampedW + 1, item.col));
          item.h = Math.max(1, item.h);

          let row = 1;
          while (true) {
            item.row = row;
            let hasCollision = false;

            for (const placedKey of Object.keys(result)) {
              if (collides(item, result[placedKey])) {
                hasCollision = true;
                break;
              }
            }

            if (!hasCollision) {
              result[key] = { ...item };
              break;
            }

            row++;
            if (row > 30) {
              result[key] = { ...item, row };
              break;
            }
          }
        }

        return result;
      };

      const toggleMinimize = (id, e) => {
        if (e) {
          e.preventDefault();
          e.stopPropagation();
        }
        const nextMin = !minimized[id];
        const newMinimized = { ...minimized, [id]: nextMin };
        setMinimized(newMinimized);
        try {
          localStorage.setItem("tminus_minimized_widgets", JSON.stringify(newMinimized));
        } catch(err) {}

        // Adjust widget's height in grid layout and run packLayout with gravity!
        const defaultHeights = { countdown: 6, milestones: 6, progress: 3 };
        const current = gridLayoutRef.current[id] || { col: 1, row: 1, w: 4, h: 6 };
        const targetH = nextMin ? 1 : (current.h > 1 ? current.h : (defaultHeights[id] || 4));

        const updated = {
          ...gridLayoutRef.current,
          [id]: { ...current, h: targetH }
        };

        const packed = packLayout(updated, id);
        saveLayout(packed);
        triggerHaptic("light");
      };

      // Accurate pixel-to-coordinate mapping accounting for grid gap & scale
      const getGridCoordFromPointer = (clientX, clientY) => {
        if (!gridContainerRef.current) return { col: 1, row: 1 };
        const rect = gridContainerRef.current.getBoundingClientRect();
        
        const colGap = 16;
        const rowGap = 16;
        const baseRowHeight = 44;

        const availableWidth = Math.max(100, rect.width - 7 * colGap);
        const colWidth = availableWidth / 8;
        const colStep = colWidth + colGap;

        const relX = clientX - rect.left;
        const rawCol = Math.floor(relX / colStep) + 1;

        const rowStep = baseRowHeight + rowGap;
        const relY = clientY - rect.top;
        const rawRow = Math.floor(relY / rowStep) + 1;

        const col = Math.max(1, Math.min(8, rawCol));
        const row = Math.max(1, Math.min(24, rawRow));
        return { col, row };
      };

      const handleStartDrag = (id, e) => {
        e.preventDefault();
        e.stopPropagation();

        try {
          if (e.target && e.target.setPointerCapture && e.pointerId !== undefined) {
            e.target.setPointerCapture(e.pointerId);
          }
        } catch (err) {}

        const clientX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
        const clientY = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
        const current = gridLayoutRef.current[id] || { col: 1, row: 1, w: 4, h: 6 };
        const coord = getGridCoordFromPointer(clientX, clientY);

        dragStartOffset.current = {
          pointerId: e.pointerId,
          targetEl: e.target,
          mouseX: clientX,
          mouseY: clientY,
          grabColOffset: coord.col - current.col,
          grabRowOffset: coord.row - current.row,
          origCol: current.col,
          origRow: current.row,
          origW: current.w,
          origH: current.h,
          initialLayout: JSON.parse(JSON.stringify(gridLayoutRef.current)),
          isDraggingActive: false
        };

        activeDragIdRef.current = id;
        resizingIdRef.current = null;
        setActiveDragId(id);
        setResizingId(null);
        triggerHaptic("light");
      };

      const handleStartResize = (id, direction, e) => {
        e.preventDefault();
        e.stopPropagation();

        try {
          if (e.target && e.target.setPointerCapture && e.pointerId !== undefined) {
            e.target.setPointerCapture(e.pointerId);
          }
        } catch (err) {}

        const clientX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
        const clientY = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
        const current = gridLayoutRef.current[id] || { col: 1, row: 1, w: 4, h: 6 };

        dragStartOffset.current = {
          pointerId: e.pointerId,
          targetEl: e.target,
          mouseX: clientX,
          mouseY: clientY,
          direction,
          origCol: current.col,
          origRow: current.row,
          origW: current.w,
          origH: current.h,
          initialLayout: JSON.parse(JSON.stringify(gridLayoutRef.current)),
          isDraggingActive: true
        };

        resizingIdRef.current = { id, direction };
        activeDragIdRef.current = null;
        setResizingId({ id, direction });
        setActiveDragId(null);
        triggerHaptic("light");
      };

      useEffect(() => {
        const handleMove = (e) => {
          const currentDrag = activeDragIdRef.current;
          const currentResize = resizingIdRef.current;

          if (!currentDrag && !currentResize) return;

          const clientX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
          const clientY = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);

          const deltaX = Math.abs(clientX - dragStartOffset.current.mouseX);
          const deltaY = Math.abs(clientY - dragStartOffset.current.mouseY);
          if (deltaX < 3 && deltaY < 3 && !dragStartOffset.current.isDraggingActive) {
            return;
          }
          dragStartOffset.current.isDraggingActive = true;

          const gridRect = gridContainerRef.current ? gridContainerRef.current.getBoundingClientRect() : null;
          const colGap = 16;
          const rowGap = 16;
          const baseRowHeight = 44;
          const availableWidth = gridRect ? Math.max(100, gridRect.width - 7 * colGap) : 800;
          const colStep = (availableWidth / 8) + colGap;
          const rowStep = baseRowHeight + rowGap; // 60px

          const deltaPixelX = clientX - dragStartOffset.current.mouseX;
          const deltaPixelY = clientY - dragStartOffset.current.mouseY;

          const deltaCols = Math.round(deltaPixelX / colStep);
          const deltaRows = Math.round(deltaPixelY / rowStep);

          const initial = dragStartOffset.current.initialLayout || gridLayoutRef.current;

          if (currentDrag) {
            const item = initial[currentDrag];
            if (!item) return;

            const { origCol, origRow, origW, origH } = dragStartOffset.current;
            const clampedW = Math.max(1, Math.min(8, origW));
            const clampedH = Math.max(1, origH);

            const targetCol = origCol + deltaCols;
            const targetRow = origRow + deltaRows;

            const clampedCol = Math.max(1, Math.min(8 - clampedW + 1, targetCol));
            const clampedRow = Math.max(1, Math.min(24, targetRow));

            setHoverCoord({ col: clampedCol, row: clampedRow });

            const updated = {
              ...initial,
              [currentDrag]: { ...item, col: clampedCol, row: clampedRow, w: clampedW, h: clampedH }
            };
            const packed = packLayout(updated, currentDrag);
            saveLayout(packed);
          } else if (currentResize) {
            const { id, direction } = currentResize;
            const item = initial[id];
            if (!item) return;

            const limits = MIN_CONSTRAINTS[id] || { minW: 1, minH: 1 };
            const { origCol, origRow, origW, origH } = dragStartOffset.current;

            let newCol = origCol;
            let newRow = origRow;
            let newW = origW;
            let newH = origH;

            // East / West (Horizontal resizing)
            if (direction.includes('e')) {
              newW = Math.max(limits.minW, Math.min(8 - origCol + 1, origW + deltaCols));
            } else if (direction.includes('w')) {
              const maxShrink = origW - limits.minW;
              const maxExpandLeft = origCol - 1;
              const clampedDelta = Math.min(maxShrink, Math.max(-maxExpandLeft, deltaCols));
              newCol = origCol + clampedDelta;
              newW = origW - clampedDelta;
            }

            // South / North (Vertical resizing)
            if (direction.includes('s')) {
              newH = Math.max(limits.minH, Math.min(16, origH + deltaRows));
            } else if (direction.includes('n')) {
              const maxShrink = origH - limits.minH;
              const maxExpandUp = origRow - 1;
              const clampedDelta = Math.min(maxShrink, Math.max(-maxExpandUp, deltaRows));
              newRow = origRow + clampedDelta;
              newH = origH - clampedDelta;
            }

            setHoverCoord({ col: newCol, row: newRow });

            const updated = {
              ...initial,
              [id]: { ...item, col: newCol, row: newRow, w: newW, h: newH }
            };
            const packed = packLayout(updated, id);
            saveLayout(packed);
          }
        };

        const handleEnd = () => {
          const finishedDrag = activeDragIdRef.current;
          const finishedResize = resizingIdRef.current ? resizingIdRef.current.id : null;
          const activeTarget = finishedDrag || finishedResize;

          if (activeTarget) {
            const finalClean = packLayout(gridLayoutRef.current, activeTarget);
            saveLayout(finalClean);
            triggerHaptic("medium");
          }

          try {
            if (dragStartOffset.current.targetEl && dragStartOffset.current.pointerId !== undefined) {
              dragStartOffset.current.targetEl.releasePointerCapture(dragStartOffset.current.pointerId);
            }
          } catch (err) {}

          dragStartOffset.current.isDraggingActive = false;
          dragStartOffset.current.initialLayout = null;
          activeDragIdRef.current = null;
          resizingIdRef.current = null;
          setActiveDragId(null);
          setResizingId(null);
          setHoverCoord(null);
        };

        window.addEventListener("pointermove", handleMove);
        window.addEventListener("pointerup", handleEnd);
        window.addEventListener("pointercancel", handleEnd);

        return () => {
          window.removeEventListener("pointermove", handleMove);
          window.removeEventListener("pointerup", handleEnd);
          window.removeEventListener("pointercancel", handleEnd);
        };
      }, []);

      const resetLayout = () => {
        saveLayout(DEFAULT_GRID_LAYOUT);
        setMinimized({});
        try {
          localStorage.removeItem("tminus_minimized_widgets");
          localStorage.removeItem("custom_coord_grid_layout");
        } catch(e) {}
        showNotification("Layout reset to default positions");
        triggerHaptic("light");
      };

      // Enhanced presets that cycle from minimal to standard to full width
      const cycleWidgetPreset = (id, e) => {
        e.stopPropagation();
        const current = gridLayout[id];
        let nextW = 4;
        let nextH = 6;
        if (current.w <= 2) { nextW = 4; nextH = 6; }
        else if (current.w <= 4 && current.h <= 4) { nextW = 8; nextH = 4; }
        else if (current.w >= 8) { nextW = 4; nextH = 2; }
        else { nextW = 4; nextH = 6; }

        const clampedCol = Math.min(8 - nextW + 1, current.col);
        const updated = {
          ...gridLayout,
          [id]: { ...current, col: clampedCol, w: nextW, h: nextH }
        };
        const packed = packLayout(updated, id);
        saveLayout(packed);
        triggerHaptic("light");
      };

      useEffect(() => {
        const interval = setInterval(() => setNow(Date.now()), 1000);
        return () => clearInterval(interval);
      }, []);

      const showNotification = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(""), 3500);
      };

      const toggleCheck = (id) => {
        const next = { ...completed, [id]: !completed[id] };
        setCompleted(next);
        triggerHaptic("medium");
        try {
          localStorage.setItem("milestones_cache", JSON.stringify(next));
        } catch(e) {}
      };

      const currentFormattedTime = useMemo(() => {
        return new Intl.DateTimeFormat("en-US", {
          timeZone: selectedTz,
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false
        }).format(now);
      }, [now, selectedTz]);

      const currentFormattedDate = useMemo(() => {
        return new Intl.DateTimeFormat("en-US", {
          timeZone: selectedTz,
          weekday: "short",
          day: "2-digit",
          month: "short"
        }).format(now);
      }, [now, selectedTz]);

      // Calculate Target Deadline diff
      const targetDeadlineMs = useMemo(() => {
        try {
          return new Date(targetIso).getTime();
        } catch {
          return new Date(DEFAULT_TARGET_ISO).getTime();
        }
      }, [targetIso]);

      const formattedTargetDisplay = useMemo(() => {
        try {
          const d = new Date(targetIso);
          return d.toLocaleDateString("en-US", { month: "short", day: "2-digit", year: "numeric" }) +
            " • " + d.toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit" });
        } catch {
          return "Nov 16, 2026 • 09:00 AM IST";
        }
      }, [targetIso]);

      const diffMs = Math.max(0, targetDeadlineMs - now);
      const isCompletedSprint = targetDeadlineMs <= now;
      const totalSec = Math.floor(diffMs / 1000);
      const days = Math.floor(totalSec / (3600 * 24));
      const hours = Math.floor((totalSec % (3600 * 24)) / 3600);
      const minutes = Math.floor((totalSec % 3600) / 60);
      const seconds = totalSec % 60;

      const isRadialActive = forceRadialMode || (days === 0 && hours < 24);
      const dialCircumference = 2 * Math.PI * 40;
      const dialOffset = dialCircumference * (1 - ((minutes % 60) * 60 + seconds) / 3600);

      const generateGCalUrl = (m) => {
        const start = new Date(m.isoDate).toISOString().replace(/-|:|\.\d\d\d/g, "");
        const end = new Date(new Date(m.isoDate).getTime() + 60 * 60 * 1000).toISOString().replace(/-|:|\.\d\d\d/g, "");
        const details = encodeURIComponent(`${m.desc}\n\nMilestone Tag: ${m.tag}\n${targetTitle} Roadmap`);
        const title = encodeURIComponent(`[${m.tag}] ${m.title}`);
        return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&details=${details}&dates=${start}/${end}`;
      };

      const downloadAllIcs = () => {
        let icsContent = `BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//${targetTitle} Sprint//EN\nCALSCALE:GREGORIAN\nMETHOD:PUBLISH\n`;
        milestones.forEach(m => {
          const start = new Date(m.isoDate).toISOString().replace(/-|:|\.\d\d\d/g, "");
          const end = new Date(new Date(m.isoDate).getTime() + 3600000).toISOString().replace(/-|:|\.\d\d\d/g, "");
          icsContent += `BEGIN:VEVENT\nSUMMARY:[${m.tag}] ${m.title}\nDESCRIPTION:${m.desc}\nDTSTART:${start}\nDTEND:${end}\nSTATUS:CONFIRMED\nEND:VEVENT\n`;
        });
        icsContent += "END:VCALENDAR";

        const blob = new Blob([icsContent], { type: "text/calendar;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.setAttribute("download", `${targetTitle.toLowerCase().replace(/\s+/g, "-")}-milestones.ics`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showNotification(`All ${milestones.length} milestones exported as .ics calendar!`);
        triggerHaptic("medium");
      };

      const completedCount = milestones.filter(m => !!completed[m.id]).length;
      const progressPercent = milestones.length > 0 ? Math.round((completedCount / milestones.length) * 100) : 0;

      // Sprint modal handlers
      const handleSaveSprint = () => {
        if (!tempTitle.trim()) return;
        setTargetTitle(tempTitle.trim());
        const validIso = tempIso.length === 16 ? tempIso + ":00" : tempIso;
        setTargetIso(validIso);
        try {
          localStorage.setItem("tminus_target_title", tempTitle.trim());
          localStorage.setItem("tminus_target_iso", validIso);
        } catch(e) {}
        setShowSprintModal(false);
        showNotification("Sprint deadline & title updated!");
        triggerHaptic("medium");
      };

      const handleAddMilestone = (e) => {
        e.preventDefault();
        if (!newMilestoneTitle.trim() || !newMilestoneDate) return;
        const newM = {
          id: "m_" + Date.now(),
          tag: newMilestoneTag.trim() || "T-" + (milestones.length + 1),
          title: newMilestoneTitle.trim(),
          desc: newMilestoneDesc.trim() || "Sprint milestone step",
          isoDate: newMilestoneDate.length === 10 ? newMilestoneDate + "T09:00:00" : newMilestoneDate,
          dateStr: new Date(newMilestoneDate).toLocaleDateString("en-US", { month: "short", day: "2-digit", year: "numeric" })
        };
        const updated = [...milestones, newM];
        setMilestones(updated);
        try {
          localStorage.setItem("custom_milestones_list", JSON.stringify(updated));
        } catch(e) {}
        setNewMilestoneTag("");
        setNewMilestoneTitle("");
        setNewMilestoneDesc("");
        setNewMilestoneDate("");
        showNotification("New milestone added!");
        triggerHaptic("medium");
      };

      const handleDeleteMilestone = (id) => {
        const updated = milestones.filter(m => m.id !== id);
        setMilestones(updated);
        try {
          localStorage.setItem("custom_milestones_list", JSON.stringify(updated));
        } catch(e) {}
        showNotification("Milestone deleted");
        triggerHaptic("light");
      };

      const handleResetSprintDefaults = () => {
        setTargetIso(DEFAULT_TARGET_ISO);
        setTargetTitle(DEFAULT_TARGET_TITLE);
        setMilestones(INITIAL_MILESTONES);
        setTempTitle(DEFAULT_TARGET_TITLE);
        setTempIso(DEFAULT_TARGET_ISO.slice(0, 16));
        try {
          localStorage.removeItem("tminus_target_iso");
          localStorage.removeItem("tminus_target_title");
          localStorage.removeItem("custom_milestones_list");
          localStorage.removeItem("milestones_cache");
        } catch(e) {}
        setCompleted({});
        setShowSprintModal(false);
        showNotification("Reset to original portfolio roadmap defaults!");
        triggerHaptic("medium");
      };

      // Responsive rendering supporting ultra-compact sizes, one-touch minimize, and elegant text wrapping
      const renderWidgetContent = (type) => {
        const currentLayout = gridLayout[type] || { w: 4, h: 6 };
        const isWidgetMinimized = !!minimized[type] || currentLayout.h <= 1;
        const isNarrow = currentLayout.w <= 2;
        const isCompact = currentLayout.w <= 3 || currentLayout.h <= 3;

        if (type === "countdown") {
          // Ultra-slim single row view (h: 1 or minimized)
          if (isWidgetMinimized) {
            return (
              <div className={`w-full h-full min-h-[44px] rounded-2xl p-2.5 sm:p-3 flex items-center justify-between gap-3 overflow-hidden transition-all ${
                theme === 'dark' ? 'glass-dark' : 'neu-raised'
              }`}>
                <div className="flex items-center gap-2.5 min-w-0 flex-1">
                  <div 
                    onPointerDown={(e) => handleStartDrag("countdown", e)}
                    className="drag-handle p-1 -ml-1 text-slate-400 hover:text-emerald-400 transition-colors cursor-grab active:cursor-grabbing select-none flex-shrink-0" 
                    title="Drag widget"
                  >
                    <Icon name="grip" className="w-3.5 h-3.5 pointer-events-none" />
                  </div>
                  <span className={`w-2 h-2 rounded-full ${isCompletedSprint ? 'bg-red-500' : 'bg-emerald-400'} animate-pulse flex-shrink-0 shadow-[0_0_8px_rgba(16,185,129,0.5)]`} />
                  <div className="min-w-0 flex-1">
                    <div className="text-[11px] font-mono font-semibold uppercase tracking-wider text-slate-200 dark:text-slate-100 truncate">{targetTitle}</div>
                    <div className="text-[9px] font-mono text-slate-400 truncate">{formattedTargetDisplay}</div>
                  </div>
                </div>
                <div className="flex items-center gap-2 flex-shrink-0">
                  <div className="font-mono font-bold text-xs sm:text-sm text-emerald-500 dark:text-emerald-400 tabular-nums whitespace-nowrap">
                    {isCompletedSprint ? "COMPLETED" : `${days}d ${String(hours).padStart(2,'0')}h ${String(minutes).padStart(2,'0')}m ${String(seconds).padStart(2,'0')}s`}
                  </div>
                  <button
                    onClick={(e) => toggleMinimize("countdown", e)}
                    className="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-white/10 transition-colors"
                    title="Expand Countdown"
                  >
                    <Icon name="maximize" className="w-3.5 h-3.5" />
                  </button>
                </div>
              </div>
            );
          }

          // Narrow column view (w: 2)
          if (isNarrow) {
            return (
              <div className={`w-full h-full rounded-2xl sm:rounded-3xl p-3.5 flex flex-col justify-between overflow-hidden ${
                theme === 'dark' ? 'glass-dark' : 'neu-raised'
              }`}>
                <div className="flex items-center justify-between pb-2 border-b border-white/5 dark:border-white/5 border-slate-100">
                  <div className="flex items-center gap-1.5 min-w-0">
                    <div 
                      onPointerDown={(e) => handleStartDrag("countdown", e)}
                      className="drag-handle p-1 -ml-1 text-slate-400 hover:text-emerald-400 cursor-grab active:cursor-grabbing select-none flex-shrink-0"
                    >
                      <Icon name="grip" className="w-3 h-3 pointer-events-none" />
                    </div>
                    <span className="text-[10px] font-mono font-bold tracking-wider text-emerald-500 dark:text-emerald-400 uppercase truncate">T-MINUS</span>
                  </div>
                  <div className="flex items-center gap-1">

                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>

        return null;

                      Done

                      {milestones.map((m) => (
                        <a
                          key={m.id}

                  </div>
                </div>

                <div className="pt-3 text-right">
                  <button onClick={() => setShowCalendarModal(false)} className="px-4 py-2 rounded-xl text-xs font-mono bg-white/[0.06] hover:bg-white/10 text-white border border-white/10">
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>

  <!-- PWA Service Worker Registration -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").then((reg) => {
          console.log("T-Minus Service Worker active, scope:", reg.scope);
        }).catch((err) => {
          console.warn("Service worker registration:", err);
        });
      });
    }
  </script>
</body>
</html>
